name: "nobug-161841-median-different-indices-cpu-gpu"
description: "torch.median returns different indices on CPU vs GPU for tied values"
user_message: |
  `torch.median` returns different indices on CPU vs GPU for the same input tensor. The values
  are correct on both devices, but the indices differ.

  ```python
  import torch

  torch.manual_seed(9223372036854775807)
  input_tensor = torch.full((3, 4), 1.0, dtype=torch.double)
  dim = 1
  keepdim = False

  cpu_result = torch.median(input_tensor.cpu(), dim=dim, keepdim=keepdim)
  cuda_result = torch.median(input_tensor.cuda(), dim=dim, keepdim=keepdim)

  print("CPU:", cpu_result)
  print("CUDA:", cuda_result)
  ```

  CPU output:
  ```
  torch.return_types.median(
    values=tensor([1., 1., 1.], dtype=torch.float64),
    indices=tensor([1, 1, 1]))
  ```

  CUDA output:
  ```
  torch.return_types.median(
    values=tensor([1., 1., 1.], device='cuda:0', dtype=torch.float64),
    indices=tensor([0, 0, 0], device='cuda:0'))
  ```

  Both return the correct median value, but CPU picks index 1 while CUDA picks index 0.
  Is this a bug?

  PyTorch version: 2.5.1, CUDA 12.4
tags:
  - "cpu-cuda"
  - "set1"
llm_judge:
