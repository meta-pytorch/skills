repos:
  - repo: local
    hooks:
      - id: check-skills-sync
        name: check skills sync
        entry: uv run python scripts/check_skills_sync.py
        language: system
        files: ^(skills-with-evals/|skills/|claude-plugin-dist/|\.claude-plugin/plugin\.json$|scripts/sync_skills\.py$|scripts/check_skills_sync\.py$)
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.36
    hooks:
      - id: pymarkdown
        exclude: ^(skills|skills-with-evals)/.*/SKILL\.md$
        args:
          - --disable-rules
          - MD013,MD033,MD041,MD024
          - scan

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]
        types: [yaml]
