eval_version: '1'
skill_name: debug-graph-breaks
skill_path: skills/debug-graph-breaks/SKILL.md
models:
  - claude-opus-4-6
test_cases:
  - name: ariamodel-unsupported-context-manager
    description: Tests that the agent detects, diagnoses, and fixes graph breaks in a HuggingFace AriaModel compiled with torch.compile.
    user_message: |
      /pt2:debug-graph-breaks
      I want to compile the following model with torch.compile, but it's hitting graph breaks.
      Please detect the graph breaks, diagnose them, and write a fixed version of the script
      that compiles successfully with fullgraph=True or has as few graph breaks as possible.

      ```python
      import torch
      from transformers import AutoModel

      model = AutoModel.from_pretrained("AriaModel", trust_remote_code=True)
      model.eval()

      compiled_model = torch.compile(model, backend="eager", fullgraph=True)
      ```

      The graph break documentation website is at https://meta-pytorch.org/compile-graph-break-site/.
      When you encounter a specific graph break (e.g., GB0179), fetch the corresponding page
      (e.g., https://meta-pytorch.org/compile-graph-break-site/gb/gb0179.html) for detailed context, examples, and fix suggestions.

      To find the transformers library source code, run:
        python3 -c "import transformers, os; print(os.path.dirname(transformers.__file__))"
      You can then read source files from that directory to inspect the code causing graph breaks.

      When fixing graph breaks that originate in the transformers library, create a subclass
      of the model that overrides the problematic method(s) with compile-compatible
      implementations.

      Fix the graph breaks and save the fixed script as `fixed_model.py` in the current
      working directory. The script must be self-contained and runnable with
      `python3 fixed_model.py`.
    tags:
      - smoke
      - transformers
      - fullgraph
    deterministic_checks:
      - type: skill_invoked
        skill: debug-graph-breaks
    llm_judge:
      rubric:
        critical_requirements: &id001
          - Agent runs the script with TORCH_LOGS='graph_breaks' or fullgraph=True to detect graph breaks
          - Agent identifies the source of at least one graph break in the user code or transformers library
          - Agent explains the root cause of the graph break and why Dynamo cannot trace it
          - Agent produces a fixed_model.py script that either compiles with fullgraph=True or has fewer graph breaks than the original
        quality_factors: &id002
          - factor: Accuracy — correctly identifies the cause of the graph break and explains why Dynamo cannot trace it
            weight: 0.2
          - factor: Actionability — provides concrete fix strategies with working code examples
            weight: 0.2
          - factor: Graph break reduction — the fixed script has fewer graph breaks or achieves fullgraph compilation
            weight: 0.5
          - factor: Documentation use — references the graph break documentation website or GB type pages when explaining the break
            weight: 0.1
